<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff3df">
  <!-- 内联小图标（data URI，不会发起网络请求，也免得浏览器去找 favicon.ico 报 404） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='35' r='26' fill='%23ffd84d'/%3E%3Ccircle cx='23' cy='31' r='3.6' fill='%234a3325'/%3E%3Ccircle cx='41' cy='31' r='3.6' fill='%234a3325'/%3E%3Cpath d='M26 42q6 5 12 0' stroke='%234a3325' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>奶蛙跳一跳 · 奶蛙小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 左：游戏舞台 -->
    <main class="stage" id="stage">
      <canvas id="cv" aria-label="奶蛙跳一跳游戏画面"></canvas>

      <!-- 连击徽章（连续完美 ≥ 2 时出现） -->
      <div class="combo" id="combo" aria-hidden="true"></div>

      <!-- 开局提示：第一次起跳后消失 -->
      <div class="hint" id="hint" aria-hidden="true">
        <span class="press"><i class="ring"></i><i class="dot"></i></span>
        <span class="hint-text"><b>按住蓄力，松手起跳</b><small>电脑上也可以按住空格键</small></span>
      </div>

      <!-- 掉下去啦 -->
      <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">
        <div class="ov-card">
          <img class="ov-frog" id="ovFrog" src="../assets/nai/nai10-laugh.webp" alt="" width="132" height="132" draggable="false" onerror="this.style.display='none'">
          <h2 id="ovTitle">掉下去啦</h2>
          <p class="ov-laugh">哦齁齁齁齁～</p>
          <div class="ov-score">
            <div><span>本局得分</span><b id="ovScore">0</b></div>
            <div><span>最高分</span><b id="ovBest" class="gold">0</b></div>
          </div>
          <div class="ov-new" id="ovNew" hidden>新纪录！</div>
          <button class="btn primary big" id="btnAgain" type="button">再来一局</button>
        </div>
      </div>
    </main>

    <!-- 右：侧栏 -->
    <aside class="panel">
      <header class="head">
        <h1>奶蛙跳一跳</h1>
        <p class="sub">按住蓄力，松手起跳；落在台子正中心连击加分</p>
      </header>

      <section class="stats" aria-label="得分">
        <div class="stat"><span class="label">分数</span><b class="value" id="score">0</b></div>
        <div class="stat best"><span class="label">最高分</span><b class="value" id="best">0</b></div>
        <div class="stat combo-stat"><span class="label">连续完美</span><b class="value" id="streak">0</b></div>
      </section>

      <section class="actions">
        <button class="btn" id="btnSound" type="button" aria-label="音效开关">🔊 音效开</button>
        <button class="btn primary" id="btnRestart" type="button" title="快捷键 R">↻ 重开</button>
        <a class="btn" href="../index.html">🏠 合集</a>
      </section>

      <ul class="tips">
        <li><b>蓄力越久跳得越远</b>，按住屏幕 / 鼠标 / 空格键</li>
        <li><b>落在台面正中心 = 完美</b>，连续完美 +2、+4、+6……</li>
        <li>落在台外？奶蛙会一边笑一边掉下去</li>
      </ul>

      <footer class="foot">奶蛙是网络梗 · 本项目仅供学习娱乐</footer>
    </aside>
  </div>

  <noscript><p style="text-align:center;padding:24px">需要开启 JavaScript 才能玩奶蛙跳一跳。</p></noscript>

  <script src="../common/sfx.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
